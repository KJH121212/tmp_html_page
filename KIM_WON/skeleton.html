const NAMES = ["nose", "left_eye", "right_eye", "left_ear", "right_ear", "left_shoulder", "right_shoulder", "left_elbow", "right_elbow", "left_wrist", "right_wrist", "left_hip", "right_hip", "left_knee", "right_knee", "left_ankle", "right_ankle", "left_big_toe", "left_small_toe", "left_heel", "right_big_toe", "right_small_toe", "right_heel"];
const SKELETON = [[0, 1], [0, 2], [1, 3], [2, 4], [5, 6], [5, 7], [7, 9], [6, 8], [8, 10], [5, 11], [6, 12], [11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [15, 17], [15, 18], [15, 19], [16, 20], [16, 21], [16, 22]];

let currentIdx = 0;
let threshold = 0.25;
let scale = 1.0, offsetX = 0, offsetY = 0;
let isDragging = false, dragStartX = 0, dragStartY = 0;
let hoveredIdx = -1;
const imgCache = {};

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const viewerBox = document.getElementById("viewerBox");
const tooltip = document.getElementById("tooltip");
const imgSelect = document.getElementById("imgSelect");
const threshSlider = document.getElementById("threshSlider");
const threshInput = document.getElementById("threshInput");

SAMPLES.forEach((s, i) => {
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = `[${s.band}] ${s.title}`;
  imgSelect.appendChild(opt);
});

function resizeCanvas() {
  canvas.width = viewerBox.clientWidth;
  canvas.height = viewerBox.clientHeight;
  render();
}
window.addEventListener("resize", resizeCanvas);

function fitToScreen(img) {
  const sw = canvas.width / img.width;
  const sh = canvas.height / img.height;
  scale = Math.min(sw, sh) * 0.95;
  offsetX = (canvas.width - img.width * scale) / 2;
  offsetY = (canvas.height - img.height * scale) / 2;
  document.getElementById("zoomLabel").textContent = Math.round(scale * 100) + "%";
}

function loadAndShow(idx, resetView = true) {
  currentIdx = (idx + SAMPLES.length) % SAMPLES.length;
  imgSelect.value = currentIdx;
  document.getElementById("idxLabel").textContent = `${currentIdx + 1} / ${SAMPLES.length}`;
  const s = SAMPLES[currentIdx];
  document.getElementById("imgMeta").textContent = `${s.common_path} (frame ${s.frame_idx})`;

  if (imgCache[s.img_rel]) {
    if (resetView) fitToScreen(imgCache[s.img_rel]);
    render();
  } else {
    const im = new Image();
    im.onload = () => {
      imgCache[s.img_rel] = im;
      if (resetView) fitToScreen(im);
      render();
    };
    im.src = s.img_rel;
  }
}

function updateStats(kpts) {
  let kept = 0, drop = 0;
  const lowItems = [];
  for (let i = 0; i < kpts.length; i++) {
    const sc = kpts[i][2];
    if (sc >= threshold) kept++; else drop++;
    if (sc < 0.5) {
      const cls = sc >= threshold ? "badge-keep" : "badge-drop";
      lowItems.push(`<div class="kpt-item"><span>${i}. ${NAMES[i]}</span><span class="${cls}">${sc.toFixed(3)}</span></div>`);
    }
  }
  document.getElementById("keptCnt").textContent = kept;
  document.getElementById("dropCnt").textContent = drop;
  document.getElementById("lowKptList").innerHTML = lowItems.length ? lowItems.join("") : "<div style='color:#8b949e;'>없음</div>";
}

function render() {
  const s = SAMPLES[currentIdx];
  const im = imgCache[s.img_rel];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!im) return;

  updateStats(s.kpts23);
  const showDropped = document.getElementById("showDropped").checked;
  const showLabels = document.getElementById("showLabels").checked;
  const showSkeleton = document.getElementById("showSkeleton").checked;

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);
  ctx.drawImage(im, 0, 0);

  const kpts = s.kpts23;
  if (showSkeleton) {
    ctx.lineWidth = Math.max(1.5, 2.2 / scale);
    for (const [i, j] of SKELETON) {
      if (kpts[i][2] >= threshold && kpts[j][2] >= threshold) {
        ctx.strokeStyle = (i >= 17 || j >= 17) ? "#ffa657" : "#58a6ff";
        ctx.beginPath();
        ctx.moveTo(kpts[i][0], kpts[i][1]);
        ctx.lineTo(kpts[j][0], kpts[j][1]);
        ctx.stroke();
      }
    }
  }

  const r = Math.max(3, 5 / scale);
  ctx.font = `${Math.max(10, Math.round(13 / scale))}px sans-serif`;
  for (let i = 0; i < kpts.length; i++) {
    const [x, y, sc] = kpts[i];
    const kept = sc >= threshold;
    if (!kept && !showDropped) continue;

    if (kept) {
      ctx.fillStyle = (i >= 17) ? "#ff7b72" : "#3fb950";
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.strokeStyle = "#f85149";
      ctx.lineWidth = Math.max(1.5, 2 / scale);
      ctx.beginPath();
      ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r);
      ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r);
      ctx.stroke();
    }

    if (showLabels && sc < 0.5) {
      ctx.fillStyle = kept ? "#f0f6fc" : "#ff7b72";
      ctx.fillText(`${i}:${sc.toFixed(2)}`, x + r + 3, y - 3);
    }
    if (i === hoveredIdx) {
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = Math.max(1.5, 2 / scale);
      ctx.beginPath();
      ctx.arc(x, y, r + 4 / scale, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.restore();
  document.getElementById("zoomLabel").textContent = Math.round(scale * 100) + "%";
}

function setThreshold(val) {
  const parsed = parseFloat(val);
  if (Number.isNaN(parsed)) return;
  threshold = Math.max(0, Math.min(1, parsed));
  threshSlider.value = threshold.toFixed(2);
  if (document.activeElement !== threshInput) {
    threshInput.value = threshold.toFixed(2);
  }
  document.querySelectorAll(".presets button").forEach(b => {
    b.classList.toggle("active", Math.abs(parseFloat(b.dataset.th) - threshold) < 0.001);
  });
  render();
}

threshSlider.addEventListener("input", e => { threshInput.value = parseFloat(e.target.value).toFixed(2); setThreshold(e.target.value); });
threshInput.addEventListener("input", e => setThreshold(e.target.value));
threshInput.addEventListener("change", e => { setThreshold(e.target.value); threshInput.value = threshold.toFixed(2); });
document.querySelectorAll(".presets button").forEach(b => b.addEventListener("click", () => setThreshold(b.dataset.th)));
["showDropped", "showLabels", "showSkeleton"].forEach(id => document.getElementById(id).addEventListener("change", render));

imgSelect.addEventListener("change", e => loadAndShow(parseInt(e.target.value, 10)));
document.getElementById("prevBtn").addEventListener("click", () => loadAndShow(currentIdx - 1));
document.getElementById("nextBtn").addEventListener("click", () => loadAndShow(currentIdx + 1));
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") loadAndShow(currentIdx - 1);
  if (e.key === "ArrowRight") loadAndShow(currentIdx + 1);
});

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  offsetX = mx - (mx - offsetX) * factor;
  offsetY = my - (my - offsetY) * factor;
  scale *= factor;
  render();
}, { passive: false });

canvas.addEventListener("mousedown", e => { isDragging = true; dragStartX = e.clientX - offsetX; dragStartY = e.clientY - offsetY; });
window.addEventListener("mousemove", e => {
  if (isDragging) {
    offsetX = e.clientX - dragStartX;
    offsetY = e.clientY - dragStartY;
    tooltip.style.display = "none";
    render();
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (mx < 0 || my < 0 || mx > rect.width || my > rect.height) {
    if (hoveredIdx !== -1) { hoveredIdx = -1; render(); }
    tooltip.style.display = "none";
    return;
  }
  const ix = (mx - offsetX) / scale;
  const iy = (my - offsetY) / scale;
  const kpts = SAMPLES[currentIdx].kpts23;
  const showDropped = document.getElementById("showDropped").checked;
  let best = -1, bestDistPx = 14;
  for (let i = 0; i < kpts.length; i++) {
    const [kx, ky, sc] = kpts[i];
    if (sc < threshold && !showDropped) continue;
    const distPx = Math.hypot(kx - ix, ky - iy) * scale;
    if (distPx <= bestDistPx) {
      bestDistPx = distPx;
      best = i;
    }
  }
  if (best !== hoveredIdx) {
    hoveredIdx = best;
    render();
  }
  if (best !== -1) {
    const sc = kpts[best][2];
    const kept = sc >= threshold;
    tooltip.innerHTML = `<b>#${best} ${NAMES[best]}</b><br/>conf: <b>${sc.toFixed(4)}</b> <span style="color:${kept ? '#3fb950' : '#f85149'}">(${kept ? '유지' : '제외 X'})</span>`;
    tooltip.style.left = `${mx + 14}px`;
    tooltip.style.top = `${my + 14}px`;
    tooltip.style.display = "block";
  } else {
    tooltip.style.display = "none";
  }
});
canvas.addEventListener("mouseleave", () => {
  if (hoveredIdx !== -1) { hoveredIdx = -1; render(); }
  tooltip.style.display = "none";
});
window.addEventListener("mouseup", () => { isDragging = false; });

document.getElementById("zoomInBtn").addEventListener("click", () => { scale *= 1.25; render(); });
document.getElementById("zoomOutBtn").addEventListener("click", () => { scale /= 1.25; render(); });
document.getElementById("resetZoomBtn").addEventListener("click", () => { const im = imgCache[SAMPLES[currentIdx].img_rel]; if (im) { fitToScreen(im); render(); } });

resizeCanvas();
loadAndShow(0, true);
</script>
