<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Bayley STT & Action Dashboard</title>
<style>
    :root {
        --bg-color: #f4f6f9;
        --card-bg: #ffffff;

    .container { max-width: 1200px; margin: 0 auto; }

    /* 컨트롤 패널 */
    .control-panel {

        border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); z-index: 100; margin-bottom: 20px;

    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .video-selector {
        padding: 8px 12px; font-size: 15px; font-weight: bold; border-radius: 8px;
        border: 1px solid #ced4da; outline: none; cursor: pointer;
    }
    .current-status { font-family: monospace; font-size: 14px; font-weight: bold; color: #1976d2; }

    /* 타임라인 미니맵 */
    .timeline-container {
        position: relative; height: 32px; background: #e9ecef; border-radius: 6px;
        overflow: hidden; cursor: pointer; margin-bottom: 12px;
    }
    .action-block {
        position: absolute; height: 100%; top: 0; opacity: 0.85;
        display: flex; align-items: center; justify-content: center;
        color: white; font-size: 11px; font-weight: bold;
    }
    .scrubber-line {
        position: absolute; top: 0; bottom: 0; width: 3px; background: #000;
        z-index: 10; pointer-events: none; transition: left 0.05s ease-out;
    }

    /* 슬라이더 바 */
    .slider-box { display: flex; align-items: center; gap: 12px; }
    .slider {
        flex: 1; height: 8px; border-radius: 4px; outline: none;
        -webkit-appearance: none; background: #dee2e6; cursor: pointer;
    }
    .slider::-webkit-slider-thumb {
        -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
        background: #1976d2; cursor: pointer; border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* 실시간 감지 포커스 카드 */
    .active-card {
        background: #e3f2fd; border-left: 6px solid #1976d2; border-radius: 8px;
        padding: 14px 18px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .active-text { font-size: 16px; font-weight: bold; color: #0d47a1; }
    .active-actions { display: flex; gap: 8px; }

    /* 테이블 영역 */
    .table-card {
        background: var(--card-bg); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #eef0f2; vertical-align: middle; }
    th { background: #fafbfc; color: #495057; font-weight: 600; font-size: 13px; text-align: left; }
    
    /* 행 강조 스타일 */
    tr.acting-row { background-color: #f1f8e9; }
    tr.current-highlight {
        background-color: #fff9c4 !important; outline: 2px solid #fbc02d; font-weight: bold;
    }
    .badge {
        display: inline-block; padding: 4px 8px; border-radius: 6px;
        font-size: 11px; font-weight: 600; color: #fff;
    }
    .badge-2 { background: var(--score-2); }
    .badge-1 { background: var(--score-1); }
    .badge-0 { background: var(--score-0); }
    .time-cell { font-family: monospace; font-size: 13px; color: #555; white-space: nowrap; }
</style>
</head>

            return `<span class="badge ${badgeClass}">${act}</span>`;
        }).join(' ');

        tr.innerHTML = `
            <td class="time-cell">${d.start.toFixed(1)}s ~ ${d.end.toFixed(1)}s</td>
            <td>${d.text}</td>
            <td>${badgeHtml || '<span style="color:#adb5bd;font-size:12px;">-</span>'}</td>
        `;
        tbody.appendChild(tr);
    });

    updateState(0);
}

// 3. 슬라이더/시간 갱신 로직
function onSliderMove(sec) {
    updateState(parseFloat(sec));
}

function jumpToTimeline(event) {
    const rect = event.currentTarget.getBoundingClientRect();
    const clickX = event.clientX - rect.left;
    const pct = clickX / rect.width;
    const targetSec = currentDuration * pct;
    document.getElementById('timeSlider').value = targetSec;
    updateState(targetSec);
}

function updateState(sec) {
    // 레이블 갱신
    const pct = ((sec / currentDuration) * 100).toFixed(1);
    document.getElementById('timeStatus').innerText = `${formatSec(sec)} / ${formatSec(currentDuration)} (${pct}%)`;
    document.getElementById('scrubberLine').style.left = `${pct}%`;

    const vData = data[currentVideoKey];

    // 현재 시간에 부합하는 대사 찾기
    let activeItem = null;
    let activeIdx = -1;

    vData.dialogues.forEach((d, idx) => {
        const row = document.getElementById(`row-${idx}`);
        row.classList.remove('current-highlight');

        if (d.start <= sec && sec <= d.end) {
            activeItem = d;
            activeIdx = idx;
        }
    });

    // 포커스 카드 및 테이블 스크롤 처리
    const activeText = document.getElementById('activeText');
    const activeBadges = document.getElementById('activeBadges');

    if (activeItem) {
        activeText.innerText = `"${activeItem.text}"`;
        activeBadges.innerHTML = activeItem.matched_actions.map(act => 
            `<span class="badge badge-${activeItem.score ?? 2}" style="font-size:13px;">${act}</span>`
        ).join(' ');

        const targetRow = document.getElementById(`row-${activeIdx}`);
        targetRow.classList.add('current-highlight');
        targetRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else {
        activeText.innerText = "(발화 대사 없음)";
        activeBadges.innerHTML = "";
    }
}

// 초기 실행
if (Object.keys(data).length > 0) {
    changeVideo(Object.keys(data)[0]);
}
</script>
