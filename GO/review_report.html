<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra / GT 평가 검토 결과 리포트</title>
<style>
  :root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-alt: #f9fafc;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-muted: #475569;
    --text-subtle: #64748b;

    --primary: #2563eb;
    --primary-bg: #eff6ff;
    --primary-border: #bfdbfe;

    --astra: #4338ca;
    --astra-bg: #eef2ff;
    --astra-border: #c7d2fe;

    --gt: #0f766e;
    --gt-bg: #f0fdfa;
    --gt-border: #99f6e4;

    --ok: #15803d;
    --ok-bg: #f0fdf4;
    --ok-border: #bbf7d0;

    --bad: #b91c1c;
    --bad-bg: #fef2f2;
    --bad-border: #fecaca;

    --unrev: #475569;
    --unrev-bg: #f1f5f9;
    --unrev-border: #cbd5e1;

    --comment-bg: #fffbeb;
    --comment-border: #fde68a;
    --comment-text: #78350f;

    --radius: 10px;
    --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    font-size: 14px;
  }

  .container {
    max-width: 1440px;
    margin: 0 auto;
    padding: 20px 24px 64px;
  }

  header.page-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  header.page-header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .meta-line {
    color: var(--text-subtle);
    font-size: 12.5px;
    margin-top: 4px;
  }
  .header-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  button, select, input[type="search"] {
    font-family: inherit;
    font-size: 13px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 7px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: var(--surface-alt); border-color: #94a3b8; }
  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
  .btn-danger-soft {
    background: var(--bad-bg);
    border-color: var(--bad-border);
    color: var(--bad);
  }
  .btn-danger-soft:hover { background: #fee2e2; }
  .btn-active {
    background: var(--text);
    border-color: var(--text);
    color: #fff;
  }
  .btn-active:hover { background: #1e293b; }

  /* KPI Grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .kpi-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-subtle);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .kpi-value {
    font-size: 26px;
    font-weight: 700;
    margin: 4px 0 6px;
    letter-spacing: -0.02em;
  }
  .kpi-sub {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .progress-bar {
    height: 7px;
    background: var(--unrev-bg);
    border-radius: 999px;
    overflow: hidden;
    display: flex;
    margin-top: 8px;
  }
  .progress-ok { background: #22c55e; }
  .progress-bad { background: #ef4444; }
  .progress-unrev { background: #cbd5e1; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .tab-btn {
    padding: 9px 16px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Card & Tables */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 18px;
  }
  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-alt);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .panel-title {
    font-size: 14.5px;
    font-weight: 700;
    margin: 0;
  }
  .table-wrap {
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
  }
  th {
    background: var(--surface-alt);
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
    font-size: 12px;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #f8fafc; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .clickable-link {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    text-align: left;
  }
  .clickable-link:hover { text-decoration: underline; }

  /* Filter Bar */
  .filter-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .filter-group label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-subtle);
    white-space: nowrap;
  }
  .filter-bar select, .filter-bar input[type="search"] {
    padding: 6px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
  }
  .filter-bar input[type="search"] {
    min-width: 220px;
    flex: 1 1 220px;
  }
  .filter-summary {
    margin-left: auto;
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 600;
    white-space: nowrap;
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .badge-astra { background: var(--astra-bg); color: var(--astra); border-color: var(--astra-border); }
  .badge-ass { background: var(--gt-bg); color: var(--gt); border-color: var(--gt-border); }
  .badge-correct { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
  .badge-incorrect { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-border); }
  .badge-unreviewed { background: var(--unrev-bg); color: var(--unrev); border-color: var(--unrev-border); }
  .badge-score { background: #f1f5f9; color: #0f172a; border-color: #cbd5e1; }
  .badge-time { background: #f8fafc; color: #334155; border-color: #e2e8f0; font-variant-numeric: tabular-nums; }

  /* Video Group & Entry Cards */
  .video-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 18px;
    overflow: hidden;
  }
  .video-section-head {
    padding: 12px 16px;
    background: var(--surface-alt);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    cursor: pointer;
    user-select: none;
  }
  .video-section-head:hover { background: #f1f5f9; }
  .video-title {
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .video-stats {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--text-muted);
  }
  .entry-list {
    display: flex;
    flex-direction: column;
  }
  .entry-card {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    border-left: 4px solid transparent;
  }
  .entry-card:last-child { border-bottom: none; }
  .entry-card.verdict-correct { border-left-color: #22c55e; }
  .entry-card.verdict-incorrect { border-left-color: #ef4444; background: #fffafa; }
  .entry-card.verdict-unreviewed { border-left-color: #94a3b8; }

  .entry-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .entry-item-id {
    font-weight: 700;
    font-size: 14.5px;
    color: var(--text);
  }
  .entry-item-name {
    font-weight: 600;
    color: #1e293b;
  }
  .entry-item-en {
    font-size: 12.5px;
    color: var(--text-subtle);
  }
  .comment-box {
    background: var(--comment-bg);
    border: 1px solid var(--comment-border);
    color: var(--comment-text);
    border-radius: 7px;
    padding: 8px 12px;
    margin: 8px 0;
    font-size: 13.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .comment-box strong {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin-right: 6px;
    color: #92400e;
  }
  .entry-meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 8px 16px;
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .meta-field strong {
    color: var(--text);
    font-weight: 600;
    margin-right: 4px;
  }

  details.criteria-details {
    margin-top: 8px;
    font-size: 12.5px;
  }
  details.criteria-details summary {
    cursor: pointer;
    color: var(--primary);
    font-weight: 500;
    user-select: none;
  }
  .criteria-table {
    margin-top: 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .criteria-table td {
    padding: 6px 10px;
    font-size: 12px;
  }
  .criteria-row-active {
    background: var(--primary-bg) !important;
    font-weight: 600;
  }
  .mini-bar {
    width: 84px;
    height: 7px;
    background: var(--unrev-bg);
    border-radius: 999px;
    overflow: hidden;
    display: inline-flex;
    vertical-align: middle;
    margin-left: 6px;
  }
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-subtle);
    background: var(--surface);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
  }

  .text-ok { color: var(--ok); font-weight: 600; }
  .text-bad { color: var(--bad); font-weight: 600; }
  .text-muted { color: var(--text-subtle); }

  @media print {
    .filter-bar, .header-actions, .tabs { display: none !important; }
    .tab-panel { display: block !important; }
    body { background: #fff; font-size: 12px; }
    .container { padding: 0; max-width: 100%; }
    .panel, .video-section, .kpi-card { box-shadow: none; break-inside: avoid; }
    .entry-card { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="container">
  <header class="page-header">
    <div>
      <h1>Astra / GT 평가 검토 결과 리포트</h1>
      <div class="meta-line" id="headerMeta"></div>
    </div>
    <div class="header-actions">
      <button class="btn btn-danger-soft" id="btnQuickIncorrect" type="button">틀림 항목만 보기</button>
      <button class="btn" id="btnExportCsv" type="button">현재 결과 CSV 다운로드</button>
      <button class="btn" id="btnPrint" type="button">인쇄 / PDF 저장</button>
    </div>
  </header>

  <section class="kpi-grid" id="kpiGrid"></section>

  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="details" type="button">상세 검토 내역</button>
    <button class="tab-btn" data-tab="videos" type="button">영상별 요약</button>
    <button class="tab-btn" data-tab="items" type="button">동작 항목별 집계</button>
  </nav>

  <!-- Tab 1: Detailed Review -->
  <section class="tab-panel active" id="tab-details">
    <div class="filter-bar">
      <div class="filter-group">
        <label for="fVideo">영상</label>
        <select id="fVideo"><option value="all">전체 영상</option></select>
      </div>
      <div class="filter-group">
        <label for="fSource">소스</label>
        <select id="fSource">
          <option value="all">전체</option>
          <option value="astra">Astra</option>
          <option value="ass">GT (ASS)</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="fVerdict">평가 판정</label>
        <select id="fVerdict">
          <option value="all">전체</option>
          <option value="incorrect">틀림</option>
          <option value="correct">옳음</option>
          <option value="unreviewed">미판정</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="fScoreVerdict">점수 판정</label>
        <select id="fScoreVerdict">
          <option value="all">전체</option>
          <option value="incorrect">틀림</option>
          <option value="correct">옳음</option>
          <option value="unreviewed">미판정</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="fComment">코멘트</label>
        <select id="fComment">
          <option value="all">전체</option>
          <option value="with">코멘트 있음</option>
          <option value="without">코멘트 없음</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="fSort">정렬</label>
        <select id="fSort">
          <option value="video_time">영상 · 시간순</option>
          <option value="incorrect_first">틀림 우선</option>
          <option value="item_id">항목 번호순</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="fView">보기</label>
        <select id="fView">
          <option value="cards">영상별 카드</option>
          <option value="table">통합 테이블</option>
        </select>
      </div>
      <input type="search" id="fSearch" placeholder="항목(GM_31), 동작명, 코멘트, 근거 검색...">
      <button class="btn" id="btnReset" type="button">초기화</button>
      <div class="filter-summary" id="filterSummary"></div>
    </div>

    <div id="detailContainer"></div>
  </section>

  <!-- Tab 2: Video Summary -->
  <section class="tab-panel" id="tab-videos">
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">영상별 검토 현황 (최신 저장 버전 기준)</h2>
        <span class="text-muted" style="font-size:12px;">영상 이름을 클릭하면 해당 영상의 상세 내역으로 이동합니다.</span>
      </div>
      <div class="table-wrap">
        <table id="videoSummaryTable">
          <thead>
            <tr>
              <th>영상</th>
              <th class="num">Astra 전체</th>
              <th class="num">Astra 옳음</th>
              <th class="num">Astra 틀림</th>
              <th class="num">Astra 미판정</th>
              <th class="num">Astra 정답률</th>
              <th class="num">GT 전체</th>
              <th class="num">GT 옳음</th>
              <th class="num">GT 틀림</th>
              <th class="num">GT 정답률</th>
              <th class="num">코멘트</th>
              <th class="num">저장 횟수</th>
              <th>최종 저장 (KST)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Tab 3: Item Summary -->
  <section class="tab-panel" id="tab-items">
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">동작 항목별 집계 (틀림 많은 순)</h2>
        <div class="filter-group">
          <label for="fItemSource">집계 대상</label>
          <select id="fItemSource">
            <option value="astra">Astra만</option>
            <option value="all">전체 (Astra + GT)</option>
            <option value="ass">GT (ASS)만</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table id="itemSummaryTable">
          <thead>
            <tr>
              <th>항목 ID</th>
              <th>동작명 (한글 / 영문)</th>
              <th class="num">등장 수</th>
              <th class="num">옳음</th>
              <th class="num">틀림</th>
              <th class="num">미판정</th>
              <th class="num">정답률</th>
              <th>포함 영상</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function calcStats(entries) {
  let total = 0, correct = 0, incorrect = 0, unreviewed = 0, comments = 0;
  for (const e of entries) {
    total++;
    if (e.verdict === 'correct') correct++;
    else if (e.verdict === 'incorrect') incorrect++;
    else unreviewed++;
    if (e.comment) comments++;
  }
  const reviewed = correct + incorrect;
  const accuracy = reviewed > 0 ? (correct / reviewed) * 100 : null;
  return { total, correct, incorrect, unreviewed, reviewed, comments, accuracy };
}

function fmtPct(val) {
  return val === null ? '-' : `${val.toFixed(1)}%`;
}

function progressBarHtml(st, cls = 'progress-bar') {
  if (!st.total) return `<div class="${cls}"></div>`;
  const okW = (st.correct / st.total) * 100;
  const badW = (st.incorrect / st.total) * 100;
  const unW = (st.unreviewed / st.total) * 100;
  return `<div class="${cls}" title="옳음 ${st.correct} / 틀림 ${st.incorrect} / 미판정 ${st.unreviewed}">
    <div class="progress-ok" style="width:${okW}%"></div>
    <div class="progress-bad" style="width:${badW}%"></div>
    <div class="progress-unrev" style="width:${unW}%"></div>
  </div>`;
}

  for (const v of REPORT_DATA.videos) {
    for (const e of v.entries) {
      rows.push({ ...e, video_id: v.video_id, video_folder: v.folder });
    }
  }
  return rows;
}

function renderHeaderAndKpi() {
  const flat = allFlatEntries();
  const totalAll = calcStats(flat);
  const astraAll = calcStats(flat.filter(e => e.source === 'astra'));
  const gtAll = calcStats(flat.filter(e => e.source === 'ass'));

  document.getElementById('headerMeta').textContent =
    `생성 시각: ${REPORT_DATA.generated_at_kst} · 총 ${REPORT_DATA.video_count}개 영상 · 총 ${totalAll.total}개 검토 항목 (최신 저장 버전 기준)`;

  const cards = [
    {
      label: '전체 검토 현황',
      badge: `${REPORT_DATA.video_count}개 영상`,
      value: `${totalAll.reviewed} / ${totalAll.total}`,
      sub: `<span class="text-ok">옳음 ${totalAll.correct}</span><span class="text-bad">틀림 ${totalAll.incorrect}</span><span>미판정 ${totalAll.unreviewed}</span>`,
      bar: progressBarHtml(totalAll),
    },
    {
      label: 'Astra 정답률 (판정 완료 기준)',
      badge: `Astra ${astraAll.total}건`,
      value: fmtPct(astraAll.accuracy),
      sub: `<span class="text-ok">옳음 ${astraAll.correct}</span><span class="text-bad">틀림 ${astraAll.incorrect}</span><span>미판정 ${astraAll.unreviewed}</span>`,
      bar: progressBarHtml(astraAll),
    },
    {
      label: 'GT (ASS) 정답률 (판정 완료 기준)',
      badge: `GT ${gtAll.total}건`,
      value: fmtPct(gtAll.accuracy),
      sub: `<span class="text-ok">옳음 ${gtAll.correct}</span><span class="text-bad">틀림 ${gtAll.incorrect}</span><span>미판정 ${gtAll.unreviewed}</span>`,
      bar: progressBarHtml(gtAll),
    },
    {
      label: '검토자 코멘트 작성',
      badge: totalAll.total ? `${((totalAll.comments / totalAll.total) * 100).toFixed(1)}%` : '-',
      value: `${totalAll.comments}건`,
      sub: `<span>틀림 중 코멘트 ${flat.filter(e => e.verdict === 'incorrect' && e.comment).length}/${totalAll.incorrect}건</span>`,
      bar: '',
    },
  ];

  document.getElementById('kpiGrid').innerHTML = cards.map(c => `
    <div class="kpi-card">
      <div class="kpi-label"><span>${esc(c.label)}</span><span>${esc(c.badge)}</span></div>
      <div class="kpi-value">${esc(c.value)}</div>
      <div class="kpi-sub">${c.sub}</div>
      ${c.bar}
    </div>
  `).join('');
}

function populateVideoSelect() {
  const sel = document.getElementById('fVideo');
  sel.innerHTML = `<option value="all">전체 영상 (${REPORT_DATA.videos.length})</option>` +
    REPORT_DATA.videos.map(v => `<option value="${esc(v.video_id)}">${esc(v.video_id)} (${v.entries.length})</option>`).join('');
}

function getFilteredRows() {
  const q = state.search.trim().toLowerCase();
  let rows = allFlatEntries().filter(e => {
    if (state.video !== 'all' && e.video_id !== state.video) return false;
    if (state.source !== 'all' && e.source !== state.source) return false;
    if (state.verdict !== 'all' && e.verdict !== state.verdict) return false;
    if (state.scoreVerdict !== 'all' && (e.score_verdict || 'unreviewed') !== state.scoreVerdict) return false;
    if (state.comment === 'with' && !e.comment) return false;
    if (state.comment === 'without' && e.comment) return false;
    if (q) {
      const hay = [
        e.video_id, e.item_id, e.item_name, e.item_name_ko,
        e.comment, e.scoring_rationale, e.description, e.cluster_id, e.score, e.time_range
      ].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (state.sort === 'incorrect_first') {
    const rank = { incorrect: 0, unreviewed: 1, correct: 2 };
    rows.sort((a, b) =>
      (rank[a.verdict] ?? 9) - (rank[b.verdict] ?? 9) ||
      a.video_id.localeCompare(b.video_id) ||
      (a.start === null) - (b.start === null) ||
      (a.start ?? 0) - (b.start ?? 0)
    );
  } else if (state.sort === 'item_id') {
    rows.sort((a, b) =>
      a.item_num - b.item_num ||
      a.item_id.localeCompare(b.item_id) ||
      a.video_id.localeCompare(b.video_id)
    );
  }
  return rows;
}

function renderCriteriaDetails(e) {
  if (!e.criteria || !e.criteria.length) return '';
  const rows = e.criteria.map(c => {
    const active = String(c.score) === String(e.score) ? 'criteria-row-active' : '';
    const text = c.ko ? `${esc(c.ko)}<div class="text-muted" style="margin-top:2px;">${esc(c.en)}</div>` : esc(c.en);
    return `<tr class="${active}"><td style="width:52px;white-space:nowrap;">${esc(c.score)}점</td><td>${text}</td></tr>`;
  }).join('');
  return `
    <details class="criteria-details">
      <summary>평가 기준 보기 (2 / 1 / 0점)</summary>
      <div class="criteria-table">
        <table><tbody>${rows}</tbody></table>
      </div>
    </details>
  `;
}

function renderEntryCard(e, showVideoName = false) {
  const sourceBadge = `<span class="badge badge-${esc(e.source)}">${esc(SOURCE_LABEL[e.source] || e.source)}</span>`;
  const verdictBadge = `<span class="badge badge-${esc(e.verdict)}">평가 ${esc(VERDICT_LABEL[e.verdict] || e.verdict)}</span>`;
  const sv = e.score_verdict || 'unreviewed';
  const scoreVerdictBadge = sv !== 'unreviewed' ? `<span class="badge badge-${esc(sv)}">점수 ${esc(VERDICT_LABEL[sv] || sv)}</span>` : '';
  const scoreBadge = e.score !== '' ? `<span class="badge badge-score">${esc(e.score)}점</span>` : '';
  const timeBadge = `<span class="badge badge-time">${esc(e.time_range)}</span>`;
  const videoBadge = showVideoName ? `<span class="badge badge-time">${esc(e.video_id)}</span>` : '';

  const commentHtml = e.comment
    ? `<div class="comment-box"><strong>검토 코멘트</strong>${esc(e.comment)}</div>`
    : '';

  const metaParts = [];
  if (e.scoring_rationale) metaParts.push(`<div class="meta-field"><strong>판정 근거:</strong>${esc(e.scoring_rationale)}</div>`);
  if (e.description) metaParts.push(`<div class="meta-field"><strong>장면 설명:</strong>${esc(e.description)}</div>`);
  if (e.status) metaParts.push(`<div class="meta-field"><strong>상태:</strong>${esc(e.status)}</div>`);
  if (e.cluster_id && e.cluster_id !== 'N/A') metaParts.push(`<div class="meta-field"><strong>클러스터:</strong>${esc(e.cluster_id)}</div>`);
  if (e.raw_text) metaParts.push(`<div class="meta-field"><strong>원본 텍스트:</strong><code>${esc(e.raw_text)}</code></div>`);

  const metaHtml = metaParts.length ? `<div class="entry-meta-grid">${metaParts.join('')}</div>` : '';

  return `
    <article class="entry-card verdict-${esc(e.verdict)}">
      <div class="entry-top">
        ${videoBadge}
        ${sourceBadge}
        ${verdictBadge}
        ${scoreVerdictBadge}
        <span class="entry-item-id">${esc(e.item_id)}</span>
        ${e.item_name_ko ? `<span class="entry-item-name">${esc(e.item_name_ko)}</span>` : ''}
        ${e.item_name ? `<span class="entry-item-en">${esc(e.item_name)}</span>` : ''}
        ${scoreBadge}
        ${timeBadge}
      </div>
      ${commentHtml}
      ${metaHtml}
      ${renderCriteriaDetails(e)}
    </article>
  `;
}

function renderDetails() {
  const rows = getFilteredRows();
  const totalAll = allFlatEntries().length;
  const st = calcStats(rows);
  document.getElementById('filterSummary').textContent =
    `표시 ${rows.length} / ${totalAll}건 (옳음 ${st.correct} · 틀림 ${st.incorrect} · 미판정 ${st.unreviewed})`;

  const quickBtn = document.getElementById('btnQuickIncorrect');
  quickBtn.classList.toggle('btn-active', state.verdict === 'incorrect');

  const container = document.getElementById('detailContainer');
  if (!rows.length) {
    container.innerHTML = `<div class="empty-state">조건에 해당하는 검토 항목이 없습니다.</div>`;
    return;
  }

  if (state.view === 'table') {
    container.innerHTML = `
      <div class="panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>영상</th>
                <th>소스</th>
                <th>평가 판정</th>
                <th>점수 판정</th>
                <th>시간</th>
                <th>항목</th>
                <th>점수</th>
                <th>검토 코멘트</th>
                <th>판정 근거 / 설명</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(e => `
                <tr>
                  <td style="white-space:nowrap;">${esc(e.video_id)}</td>
                  <td><span class="badge badge-${esc(e.source)}">${esc(SOURCE_LABEL[e.source] || e.source)}</span></td>
                  <td><span class="badge badge-${esc(e.verdict)}">${esc(VERDICT_LABEL[e.verdict] || e.verdict)}</span></td>
                  <td><span class="badge badge-${esc(e.score_verdict || 'unreviewed')}">${esc(VERDICT_LABEL[e.score_verdict || 'unreviewed'] || '미판정')}</span></td>
                  <td style="white-space:nowrap;font-variant-numeric:tabular-nums;">${esc(e.time_range)}</td>
                  <td>
                    <strong>${esc(e.item_id)}</strong>
                    ${e.item_name_ko ? `<div>${esc(e.item_name_ko)}</div>` : ''}
                    ${e.item_name ? `<div class="text-muted" style="font-size:11.5px;">${esc(e.item_name)}</div>` : ''}
                  </td>
                  <td class="num">${e.score !== '' ? `${esc(e.score)}점` : '-'}</td>
                  <td style="min-width:220px;white-space:pre-wrap;">${e.comment ? esc(e.comment) : '<span class="text-muted">-</span>'}</td>
                  <td style="min-width:240px;">
                    ${e.scoring_rationale ? `<div>${esc(e.scoring_rationale)}</div>` : ''}
                    ${e.description ? `<div class="text-muted" style="margin-top:2px;">${esc(e.description)}</div>` : ''}
                    ${!e.scoring_rationale && !e.description && e.raw_text ? `<code>${esc(e.raw_text)}</code>` : ''}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
    return;
  }

  // Group by video
  const grouped = new Map();
  for (const r of rows) {
    if (!grouped.has(r.video_id)) grouped.set(r.video_id, []);
    grouped.get(r.video_id).push(r);
  }
  const videoMetaMap = new Map(REPORT_DATA.videos.map(v => [v.video_id, v]));

  const html = [];
  for (const [vid, list] of grouped.entries()) {
    const vmeta = videoMetaMap.get(vid);
    const vst = calcStats(list);
    const collapsed = state.collapsedVideos.has(vid);
    html.push(`
      <section class="video-section">
        <div class="video-section-head" data-toggle-video="${esc(vid)}">
          <div class="video-title">
            <span>${collapsed ? '▶' : '▼'}</span>
            <span>${esc(vid)}</span>
            <span class="badge badge-time">${list.length}건</span>
          </div>
          <div class="video-stats">
            <span class="text-ok">옳음 ${vst.correct}</span>
            <span class="text-bad">틀림 ${vst.incorrect}</span>
            <span>미판정 ${vst.unreviewed}</span>
            <span>정답률 ${fmtPct(vst.accuracy)}</span>
            ${vmeta ? `<span class="text-muted">· 저장 ${esc(vmeta.saved_at_kst)} (${vmeta.revision_count}회)</span>` : ''}
          </div>
        </div>
        ${collapsed ? '' : `<div class="entry-list">${list.map(e => renderEntryCard(e, false)).join('')}</div>`}
      </section>
    `);
  }
  container.innerHTML = html.join('');
}

function renderVideoSummary() {
  const tbody = document.querySelector('#videoSummaryTable tbody');
  tbody.innerHTML = REPORT_DATA.videos.map(v => {
    const astra = calcStats(v.entries.filter(e => e.source === 'astra'));
    const gt = calcStats(v.entries.filter(e => e.source === 'ass'));
    const totalComments = v.entries.filter(e => e.comment).length;
    return `
      <tr>
        <td>
          <button class="clickable-link" data-jump-video="${esc(v.video_id)}" type="button">${esc(v.video_id)}</button>
        </td>
        <td class="num">${astra.total}</td>
        <td class="num text-ok">${astra.correct}</td>
        <td class="num ${astra.incorrect ? 'text-bad' : 'text-muted'}">${astra.incorrect}</td>
        <td class="num text-muted">${astra.unreviewed}</td>
        <td class="num">${fmtPct(astra.accuracy)}${progressBarHtml(astra, 'mini-bar')}</td>
        <td class="num">${gt.total}</td>
        <td class="num text-ok">${gt.correct}</td>
        <td class="num ${gt.incorrect ? 'text-bad' : 'text-muted'}">${gt.incorrect}</td>
        <td class="num">${fmtPct(gt.accuracy)}${gt.total ? progressBarHtml(gt, 'mini-bar') : ''}</td>
        <td class="num">${totalComments}</td>
        <td class="num">${v.revision_count}</td>
        <td style="white-space:nowrap;">${esc(v.saved_at_kst)}</td>
      </tr>
    `;
  }).join('');
}

function renderItemSummary() {
  const flat = allFlatEntries().filter(e => state.itemSource === 'all' || e.source === state.itemSource);
  const byItem = new Map();
  for (const e of flat) {
    if (!byItem.has(e.item_id)) {
      byItem.set(e.item_id, {
        item_id: e.item_id,
        item_num: e.item_num,
        name_ko: e.item_name_ko,
        name_en: e.item_name,
        entries: [],
        videos: new Set(),
      });
    }
    const g = byItem.get(e.item_id);
    g.entries.push(e);
    g.videos.add(e.video_id);
    if (!g.name_ko && e.item_name_ko) g.name_ko = e.item_name_ko;
    if (!g.name_en && e.item_name) g.name_en = e.item_name;
  }

  const list = Array.from(byItem.values()).map(g => ({ ...g, st: calcStats(g.entries) }));
  list.sort((a, b) =>
    b.st.incorrect - a.st.incorrect ||
    b.st.total - a.st.total ||
    a.item_num - b.item_num
  );

  const tbody = document.querySelector('#itemSummaryTable tbody');
  tbody.innerHTML = list.map(g => `
    <tr>
      <td style="white-space:nowrap;">
        <button class="clickable-link" data-jump-item="${esc(g.item_id)}" type="button">${esc(g.item_id)}</button>
      </td>
      <td>
        ${g.name_ko ? `<div><strong>${esc(g.name_ko)}</strong></div>` : ''}
        ${g.name_en ? `<div class="text-muted" style="font-size:12px;">${esc(g.name_en)}</div>` : ''}
      </td>
      <td class="num">${g.st.total}</td>
      <td class="num text-ok">${g.st.correct}</td>
      <td class="num ${g.st.incorrect ? 'text-bad' : 'text-muted'}">${g.st.incorrect}</td>
      <td class="num text-muted">${g.st.unreviewed}</td>
      <td class="num">${fmtPct(g.st.accuracy)}${progressBarHtml(g.st, 'mini-bar')}</td>
      <td style="font-size:12px;color:var(--text-muted);">${esc(Array.from(g.videos).join(', '))}</td>
    </tr>
  `).join('');
}

function switchTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabName));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `tab-${tabName}`));
}

function syncFilterControls() {
  document.getElementById('fVideo').value = state.video;
  document.getElementById('fSource').value = state.source;
  document.getElementById('fVerdict').value = state.verdict;
  document.getElementById('fScoreVerdict').value = state.scoreVerdict;
  document.getElementById('fComment').value = state.comment;
  document.getElementById('fSort').value = state.sort;
  document.getElementById('fView').value = state.view;
  document.getElementById('fSearch').value = state.search;
}

function exportCsv() {
  const rows = getFilteredRows();
  const headers = ['video_id', 'source', 'verdict', 'score_verdict', 'item_id', 'item_name_ko', 'item_name', 'score', 'time_range', 'comment', 'scoring_rationale', 'description'];
  const csvEscape = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [headers.join(',')];
  for (const r of rows) {
    lines.push([
      r.video_id,
      SOURCE_LABEL[r.source] || r.source,
      VERDICT_LABEL[r.verdict] || r.verdict,
      VERDICT_LABEL[r.score_verdict || 'unreviewed'] || '미판정',
      r.item_id,
      r.item_name_ko,
      r.item_name,
      r.score,
      r.time_range,
      r.comment,
      r.scoring_rationale,
      r.description,
    ].map(csvEscape).join(','));
  }
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `review_report_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Event Listeners
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

document.getElementById('fVideo').addEventListener('change', e => { state.video = e.target.value; renderDetails(); });
document.getElementById('fSource').addEventListener('change', e => { state.source = e.target.value; renderDetails(); });
document.getElementById('fVerdict').addEventListener('change', e => { state.verdict = e.target.value; renderDetails(); });
document.getElementById('fScoreVerdict').addEventListener('change', e => { state.scoreVerdict = e.target.value; renderDetails(); });
document.getElementById('fComment').addEventListener('change', e => { state.comment = e.target.value; renderDetails(); });
document.getElementById('fSort').addEventListener('change', e => { state.sort = e.target.value; renderDetails(); });
document.getElementById('fView').addEventListener('change', e => { state.view = e.target.value; renderDetails(); });
document.getElementById('fSearch').addEventListener('input', e => { state.search = e.target.value; renderDetails(); });
document.getElementById('fItemSource').addEventListener('change', e => { state.itemSource = e.target.value; renderItemSummary(); });

document.getElementById('btnReset').addEventListener('click', () => {
  state.video = 'all';
  state.source = 'all';
  state.verdict = 'all';
  state.scoreVerdict = 'all';
  state.comment = 'all';
  state.sort = 'video_time';
  state.search = '';
  syncFilterControls();
  renderDetails();
});

document.getElementById('btnQuickIncorrect').addEventListener('click', () => {
  state.verdict = state.verdict === 'incorrect' ? 'all' : 'incorrect';
  syncFilterControls();
  switchTab('details');
  renderDetails();
});

document.getElementById('btnExportCsv').addEventListener('click', exportCsv);
document.getElementById('btnPrint').addEventListener('click', () => window.print());

document.addEventListener('click', e => {
  const toggleEl = e.target.closest('[data-toggle-video]');
  if (toggleEl) {
    const vid = toggleEl.dataset.toggleVideo;
    if (state.collapsedVideos.has(vid)) state.collapsedVideos.delete(vid);
    else state.collapsedVideos.add(vid);
    renderDetails();
    return;
  }
  const jumpVideo = e.target.closest('[data-jump-video]');
  if (jumpVideo) {
    state.video = jumpVideo.dataset.jumpVideo;
    state.collapsedVideos.delete(state.video);
    syncFilterControls();
    switchTab('details');
    renderDetails();
    return;
  }
  const jumpItem = e.target.closest('[data-jump-item]');
  if (jumpItem) {
    state.video = 'all';
    state.source = state.itemSource;
    state.verdict = 'all';
    state.search = jumpItem.dataset.jumpItem;
    syncFilterControls();
    switchTab('details');
    renderDetails();
  }
});

// Init
renderHeaderAndKpi();
populateVideoSelect();
renderVideoSummary();
renderItemSummary();
renderDetails();
</script>
</body>
</html>
