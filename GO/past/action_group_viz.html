<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bayley-4th Gross Motor · Action Grouping Editor</title>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-2: #475569;
    --text-3: #64748b;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.08);
    --radius: 10px;
    --mono: ui-monospace, 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
    --sans: 'Pretendard', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #0b1120;
    --surface: #111827;
    --surface-2: #1e293b;
    --border: #1f2937;
    --border-strong: #334155;
    --text: #f1f5f9;
    --text-2: #cbd5e1;
    --text-3: #94a3b8;
    --accent: #60a5fa;
    --accent-soft: rgba(59, 130, 246, 0.16);
    --danger: #f87171;
    --danger-soft: rgba(220, 38, 38, 0.15);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.45;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 7px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    z-index: 20;
    box-shadow: var(--shadow-sm);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-right: 2px;
  }
  .brand-dot {
    width: 10px; height: 10px; border-radius: 3px;
    background: linear-gradient(135deg, #4f46e5, #059669);
    flex-shrink: 0;
  }
  .brand h1 {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .brand .sub {
    font-size: 10.5px;
    color: var(--text-3);
    font-weight: 500;
  }

  .seg {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
  }
  .seg button {
    border: none;
    background: transparent;
    color: var(--text-2);
    padding: 4px 9px;
    font-size: 11.5px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    white-space: nowrap;
  }
  .seg button.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }
  .seg button:hover:not(.active) { color: var(--text); }

  .filters {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .pill {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
    font-family: inherit;
  }
  .pill .cnt {
    font-family: var(--mono);
    font-size: 10px;
    opacity: 0.85;
  }
  .pill:hover { border-color: var(--border-strong); color: var(--text); }
  .pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-wrap input {
    width: 165px;
    padding: 4px 22px 4px 24px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 11.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, width 0.2s;
  }
  .search-wrap input:focus {
    border-color: var(--accent);
    background: var(--surface);
    width: 205px;
  }
  .search-icon {
    position: absolute;
    left: 7px;
    font-size: 11px;
    color: var(--text-3);
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 5px;
    border: none;
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    font-size: 13px;
    display: none;
    line-height: 1;
  }
  .search-clear.show { display: block; }

  .icon-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    border-radius: 7px;
    padding: 4px 8px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: inherit;
    white-space: nowrap;
    transition: all 0.12s;
  }
  .icon-btn:hover:not(:disabled) { border-color: var(--border-strong); color: var(--text); }
  .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .icon-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .icon-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .icon-btn.primary:hover { filter: brightness(1.07); color: #fff; }
  .icon-btn.danger {
    color: var(--danger);
    border-color: color-mix(in srgb, var(--danger) 35%, transparent);
    background: var(--danger-soft);
  }
  .icon-btn.danger:hover { filter: brightness(0.96); }

  /* Edit Toolbar strip */
  .edit-bar {
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    padding: 5px 14px;
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--text-2);
  }
  .edit-tip {
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .dirty-badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(245, 158, 11, 0.16);
    color: #b45309;
    border: 1px solid rgba(245, 158, 11, 0.4);
    display: none;
  }
  [data-theme="dark"] .dirty-badge { color: #fcd34d; }
  .dirty-badge.show { display: inline-flex; align-items: center; gap: 4px; }
  .edit-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  /* Workspace split layout */
  .workspace {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px 28px;
    min-width: 0;
  }

  /* Cluster Board View */
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 2px 0 8px;
    gap: 8px;
  }
  .section-title {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cluster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(315px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .cluster-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--c-color);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: box-shadow 0.15s, border-color 0.15s, opacity 0.15s, transform 0.12s;
  }
  .cluster-card.selected {
    box-shadow: 0 0 0 2px var(--c-color), var(--shadow-md);
  }
  .cluster-card.drag-over {
    box-shadow: 0 0 0 2px var(--c-color), 0 0 0 5px color-mix(in srgb, var(--c-color) 18%, transparent);
    transform: translateY(-1px);
  }
  .cluster-head {
    padding: 8px 10px;
    background: color-mix(in srgb, var(--c-color) 9%, var(--surface));
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    user-select: none;
  }
  .cluster-head:hover { background: color-mix(in srgb, var(--c-color) 14%, var(--surface)); }
  .cluster-name-ko {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cluster-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--c-color);
    flex-shrink: 0;
  }
  .cluster-name-en {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 1px;
  }
  .cluster-badges {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .count-badge {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 700;
    color: var(--c-color);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 999px;
  }
  .collapse-btn {
    border: none;
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    font-size: 11px;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .collapse-btn:hover { background: rgba(0,0,0,0.06); color: var(--text); }

  .cluster-body {
    padding: 5px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 44px;
  }
  .cluster-card.collapsed .cluster-body { display: none; }
  .cluster-empty-drop {
    border: 1px dashed var(--border-strong);
    border-radius: 6px;
    padding: 10px;
    text-align: center;
    font-size: 11px;
    color: var(--text-3);
  }

  /* Action Row */
  .action-row {
    padding: 6px 8px;
    border-radius: 7px;
    border: 1px solid transparent;
    cursor: grab;
    transition: background 0.12s, border-color 0.12s, opacity 0.15s;
    display: flex;
    flex-direction: column;
    gap: 2px;
    position: relative;
  }
  .action-row:active, .standalone-card:active { cursor: grabbing; }
  .action-row.dragging, .standalone-card.dragging { opacity: 0.4; }
  .action-row:hover {
    background: var(--surface-2);
    border-color: var(--border);
  }
  .action-row.selected {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .action-row.rel-highlight {
    background: rgba(245, 158, 11, 0.12);
    border-color: #f59e0b;
  }
  .action-top {
    display: flex;
    align-items: baseline;
    gap: 6px;
    min-width: 0;
  }
  .drag-grip {
    color: var(--text-3);
    opacity: 0.45;
    font-size: 10px;
    letter-spacing: -1px;
    user-select: none;
    flex-shrink: 0;
  }
  .action-row:hover .drag-grip, .standalone-card:hover .drag-grip { opacity: 0.9; }
  .gm-id {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--c-color, #64748b) 13%, var(--surface));
    color: var(--c-color, var(--text-2));
    border: 1px solid color-mix(in srgb, var(--c-color, #94a3b8) 30%, transparent);
    flex-shrink: 0;
  }
  .action-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex: 1;
  }
  .action-title .en {
    font-weight: 400;
    color: var(--text-3);
    font-size: 11.5px;
  }
  .cross-tag {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    color: #d97706;
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.35);
    padding: 0 5px;
    border-radius: 4px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .action-desc {
    font-size: 11.5px;
    color: var(--text-2);
    padding-left: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  body.hide-desc .action-desc { display: none; }

  /* Standalone Drop Zone */
  .standalone-zone {
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    padding: 8px;
    background: color-mix(in srgb, var(--surface-2) 60%, transparent);
    transition: border-color 0.15s, background 0.15s;
  }
  .standalone-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .standalone-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
    gap: 7px;
  }
  .standalone-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid #94a3b8;
    border-radius: 8px;
    box-shadow: var(--shadow-sm);
    padding: 6px 8px;
    cursor: grab;
    transition: all 0.12s;
  }
  .standalone-card:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .standalone-card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .standalone-card.rel-highlight { border-color: #f59e0b; background: rgba(245,158,11,0.12); }

  /* Sequence View */
  .seq-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 7px;
  }
  .seq-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--c-color, #94a3b8);
    border-radius: 8px;
    padding: 7px 9px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 3px;
    transition: all 0.12s;
  }
  .seq-card:hover { background: var(--surface-2); border-color: var(--border-strong); }
  .seq-card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .seq-card.rel-highlight { border-color: #f59e0b; background: rgba(245,158,11,0.12); }
  .seq-meta {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 2px;
  }
  .mini-pill {
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-3);
    font-weight: 600;
  }

  /* Graph View */
  .graph-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .graph-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 11.5px;
    color: var(--text-2);
  }
  .legend {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .legend-line {
    width: 18px;
    height: 2px;
    display: inline-block;
  }
  .graph-svg-box {
    width: 100%;
    overflow-x: auto;
  }
  svg#relGraph {
    width: 100%;
    min-width: 820px;
    height: auto;
    display: block;
    user-select: none;
  }
  .g-node { cursor: pointer; transition: opacity 0.15s; }
  .g-edge { fill: none; transition: opacity 0.15s, stroke-width 0.15s; pointer-events: none; }

  /* Right Inspector Panel */
  aside.inspector {
    width: 400px;
    flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.2s, border-color 0.2s;
  }
  aside.inspector.closed {
    width: 0;
    border-left-color: transparent;
  }
  .insp-head {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--surface-2);
  }
  .insp-head-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-2);
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .insp-close {
    border: none;
    background: transparent;
    color: var(--text-3);
    font-size: 16px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 5px;
    line-height: 1;
  }
  .insp-close:hover { background: var(--border); color: var(--text); }
  .insp-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .insp-hero { display: flex; flex-direction: column; gap: 4px; }
  .insp-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cluster-chip {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    cursor: pointer;
    border: 1px solid transparent;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .insp-title-ko {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-top: 2px;
  }
  .insp-title-en {
    font-size: 12.5px;
    color: var(--text-3);
    font-weight: 500;
  }
  .insp-summary {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12.5px;
    color: var(--text);
  }

  .insp-section { display: flex; flex-direction: column; gap: 6px; }
  .insp-sec-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-3);
  }

  /* Form controls inside inspector */
  .field-box {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .field-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .field-row label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-3);
  }
  .field-row input[type="text"],
  .field-row textarea,
  .field-row select {
    width: 100%;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }
  .field-row input:focus,
  .field-row textarea:focus,
  .field-row select:focus {
    border-color: var(--accent);
  }
  .field-row textarea { resize: vertical; min-height: 54px; line-height: 1.4; }
  .color-palette {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .swatch {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.active { border-color: var(--text); transform: scale(1.12); }

  /* Scoring cards */
  .score-list { display: flex; flex-direction: column; gap: 5px; }
  .score-row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 7px 8px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    font-size: 12px;
  }
  .score-badge {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 5px;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .score-2 { background: #dcfce7; color: #15803d; }
  .score-1 { background: #fef3c7; color: #b45309; }
  .score-0 { background: #ffe4e6; color: #be123c; }
  [data-theme="dark"] .score-2 { background: rgba(22,163,74,0.22); color: #86efac; }
  [data-theme="dark"] .score-1 { background: rgba(217,119,6,0.22); color: #fcd34d; }

const STORAGE_KEY = 'bayley_action_group_draft_v1';
const PALETTE = [
  '#4f46e5', '#0d9488', '#d97706', '#2563eb', '#7c3aed',
  '#e11d48', '#059669', '#0891b2', '#ea580c', '#db2777', '#65a30d', '#475569'
];

const actions = BASE_DATA.actions;
const actionOrder = BASE_DATA.actionOrder;

function cloneClusters(list) {
  return list.map(c => ({ ...c, actions: [...c.actions] }));
}

function serializeForExport(clusterList) {
  const clustersObj = {};
  for (const c of clusterList) {
    clustersObj[c.id] = {
      title: c.title || c.id,
      alias: c.alias || c.ko || c.id,
      actions: [...c.actions],
      desc: c.desc || '',
    };
  }
  return {
    actions: BASE_DATA.rawActions,
    clusters: clustersObj,
  };
}

const originalExportStr = JSON.stringify(serializeForExport(BASE_DATA.clusters));

const state = {
  clusters: cloneClusters(BASE_DATA.clusters),
  undoStack: [],
  view: 'board',
  filter: 'all',
  query: '',
  selectedType: null,
  selectedId: null,
  showDesc: true,
  allCollapsed: false,
  collapsedClusters: new Set(),
  scoreLang: 'ko',
  showExternalInGraph: true,
  inspectorOpen: true,
  draggingActionId: null,
};

// Restore draft from localStorage if exists
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    const parsed = JSON.parse(saved);
    if (Array.isArray(parsed)) state.clusters = parsed;
  }
} catch (_) {}

function saveDraft() {
  try {
    if (isDirty()) localStorage.setItem(STORAGE_KEY, JSON.stringify(state.clusters));
    else localStorage.removeItem(STORAGE_KEY);
  } catch (_) {}
}

function isDirty() {
  return JSON.stringify(serializeForExport(state.clusters)) !== originalExportStr;
}

function pushUndo() {
  state.undoStack.push(cloneClusters(state.clusters));
  if (state.undoStack.length > 40) state.undoStack.shift();
}

function getClusterMap() {
  return Object.fromEntries(state.clusters.map(c => [c.id, c]));
}

function getActionCluster(gid) {
  return state.clusters.find(c => c.actions.includes(gid)) || null;
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function hasCrossClusterLink(gid) {
  const a = actions[gid];
  if (!a) return false;
  const myC = getActionCluster(gid)?.id || null;
  const check = (otherId) => {
    if (!actions[otherId]) return false;
    const otherC = getActionCluster(otherId)?.id || null;
    return myC !== otherC;
  };
  return a.related.some(check) || a.referenced_by.some(check);
}

function getCrossLinks(gid) {
  const a = actions[gid];
  if (!a) return [];
  const myC = getActionCluster(gid)?.id || null;
  const set = new Set();
  for (const r of [...a.related, ...a.referenced_by]) {
    if (actions[r]) {
      const otherC = getActionCluster(r)?.id || null;
      if (myC !== otherC) set.add(r);
    }
  }
  return [...set].sort((x, y) => actions[x].num - actions[y].num);
}

function getAllRelatedInScope(gid) {
  const a = actions[gid];
  if (!a) return new Set();
  const s = new Set();
  for (const r of [...a.related, ...a.referenced_by]) {
    if (actions[r]) s.add(r);
  }
  return s;
}

function matchesFilterAndQuery(gid) {
  const a = actions[gid];
  if (!a) return false;
  const c = getActionCluster(gid);
  if (state.filter === 'clustered' && !c) return false;
  if (state.filter === 'standalone' && c) return false;
  if (state.filter === 'cross' && !hasCrossClusterLink(gid)) return false;

  const q = state.query.trim().toLowerCase();
  if (!q) return true;
  const hay = [
    a.id, String(a.num), a.name_ko, a.name_en, a.alias, a.desc, a.materials,
    c ? c.id : '', c ? c.ko : '', c ? c.title : '', c ? c.alias : '',
  ].join(' ').toLowerCase();
  return hay.includes(q);
}

// Mutations
function moveActionToCluster(gid, targetClusterId) {
  const current = getActionCluster(gid);
  const currentId = current ? current.id : null;
  if (currentId === targetClusterId) return;

  pushUndo();
  for (const c of state.clusters) {
    c.actions = c.actions.filter(id => id !== gid);
  }
  if (targetClusterId) {
    const target = state.clusters.find(c => c.id === targetClusterId);
    if (target) {
      target.actions.push(gid);
      target.actions.sort((x, y) => actions[x].num - actions[y].num);
      showToast(`${gid} → ${target.ko} 이동`);
    }
  } else {
    showToast(`${gid} → 단독 항목으로 이동`);
  }
  afterMutate();
}

function createNewCluster() {
  pushUndo();
  let idx = state.clusters.length + 1;
  let newId = `Cluster_Custom_${idx}`;
  const existing = new Set(state.clusters.map(c => c.id));
  while (existing.has(newId)) {
    idx++;
    newId = `Cluster_Custom_${idx}`;
  }
  const color = PALETTE[state.clusters.length % PALETTE.length];
  state.clusters.push({
    id: newId,
    ko: `새 그룹 ${idx}`,
    title: `Custom Group ${idx}`,
    alias: `Custom Group ${idx}`,
    desc: '새로 만든 동작 그룹 설명을 입력하세요.',
    actions: [],
    color,
    order: state.clusters.length + 1,
  });
  state.selectedType = 'cluster';
  state.selectedId = newId;
  state.inspectorOpen = true;
  syncInspectorToggle();
  afterMutate();
  showToast(`새 그룹(${newId}) 생성됨`);
}

function deleteCluster(cid) {
  const c = state.clusters.find(x => x.id === cid);
  if (!c) return;
  if (c.actions.length > 0 && !confirm(`"${c.ko}" 그룹을 삭제할까요?\n포함된 ${c.actions.length}개 동작은 단독 항목으로 이동합니다.`)) {
    return;
  }
  pushUndo();
  state.clusters = state.clusters.filter(x => x.id !== cid);
  if (state.selectedType === 'cluster' && state.selectedId === cid) {
    state.selectedType = null;
    state.selectedId = null;
  }
  afterMutate();
  showToast(`그룹 삭제됨 (동작은 단독 항목으로 보존)`);
}

function updateClusterField(cid, patch) {
  const c = state.clusters.find(x => x.id === cid);
  if (!c) return;
  if (patch.id && patch.id !== cid) {
    const cleanId = patch.id.trim().replace(/\s+/g, '_');
    if (!cleanId) return;
    if (state.clusters.some(x => x.id === cleanId)) {
      showToast('이미 존재하는 Cluster ID입니다.');
      renderInspector();
      return;
    }
    pushUndo();
    c.id = cleanId;
    if (state.selectedType === 'cluster' && state.selectedId === cid) {
      state.selectedId = cleanId;
    }
  } else {
    pushUndo();
    Object.assign(c, patch);
  }
  afterMutate();
}

function undo() {
  if (state.undoStack.length === 0) return;
  state.clusters = state.undoStack.pop();
  if (state.selectedType === 'cluster' && !state.clusters.some(c => c.id === state.selectedId)) {
    state.selectedType = null;
    state.selectedId = null;
  }
  afterMutate();
  showToast('이전 상태로 되돌림');
}

function resetToOriginal() {
  if (!confirm('수정 내용을 모두 취소하고 원본 config/action_group.json 상태로 되돌릴까요?')) return;
  pushUndo();
  state.clusters = cloneClusters(BASE_DATA.clusters);
  if (state.selectedType === 'cluster' && !state.clusters.some(c => c.id === state.selectedId)) {
    state.selectedType = null;
    state.selectedId = null;
  }
  afterMutate();
  showToast('원본 상태로 복원됨');
}

function afterMutate() {
  saveDraft();
  updateStatusUI();
  renderMain();
  renderInspector();
}

function updateStatusUI() {
  const all = actionOrder.length;
  const clustered = actionOrder.filter(id => Boolean(getActionCluster(id))).length;
  const standalone = all - clustered;
  const cross = actionOrder.filter(hasCrossClusterLink).length;
  document.getElementById('cntAll').textContent = all;
  document.getElementById('cntClustered').textContent = clustered;
  document.getElementById('cntStandalone').textContent = standalone;
  document.getElementById('cntCross').textContent = cross;

  const dirty = isDirty();
  document.getElementById('dirtyBadge').classList.toggle('show', dirty);
  document.getElementById('resetBtn').disabled = !dirty;
  document.getElementById('undoBtn').disabled = state.undoStack.length === 0;
}

function selectAction(gid) {
  state.selectedType = 'action';
  state.selectedId = gid;
  state.inspectorOpen = true;
  syncInspectorToggle();
  renderMain();
  renderInspector();
}

function selectCluster(cid) {
  state.selectedType = 'cluster';
  state.selectedId = cid;
  state.inspectorOpen = true;
  syncInspectorToggle();
  renderMain();
  renderInspector();
}

function clearSelection() {
  state.selectedType = null;
  state.selectedId = null;
  renderMain();
  renderInspector();
}

function syncInspectorToggle() {
  const insp = document.getElementById('inspector');
  const btn = document.getElementById('toggleInspBtn');
  insp.classList.toggle('closed', !state.inspectorOpen);
  btn.classList.toggle('on', state.inspectorOpen);
}

function applyHoverHighlights(gid) {
  const relSet = gid ? getAllRelatedInScope(gid) : new Set();
  document.querySelectorAll('[data-action-id]').forEach(el => {
    const id = el.getAttribute('data-action-id');
    el.classList.toggle('rel-highlight', Boolean(gid && id !== gid && relSet.has(id)));
  });
}

function renderActionRowHTML(gid, isStandalone = false) {
  const a = actions[gid];
  const c = getActionCluster(gid);
  const styleVar = `--c-color:${c ? c.color : '#64748b'};`;
  const isSel = state.selectedType === 'action' && state.selectedId === gid;
  const cross = getCrossLinks(gid);
  const crossBadge = cross.length
    ? `<span class="cross-tag" title="Bayley Related Item 교차 연결: ${cross.join(', ')}">↔ ${cross.map(x => x.replace('GM_', '')).join(',')}</span>`
    : '';
  const cls = isStandalone ? 'standalone-card' : 'action-row';
  return `
    <div class="${cls} ${isSel ? 'selected' : ''}" draggable="true" data-action-id="${gid}" style="${styleVar}">
      <div class="action-top">
        <span class="drag-grip" title="드래그하여 그룹 이동">⋮⋮</span>
        <span class="gm-id">${gid}</span>
        <span class="action-title" title="${esc(a.name_ko)} (${esc(a.name_en)})">${esc(a.name_ko)} <span class="en">(${esc(a.name_en)})</span></span>
        ${crossBadge}
      </div>
      <div class="action-desc" title="${esc(a.desc)}">${esc(a.desc)}</div>
    </div>
  `;
}

function renderBoardView(main) {
  const visibleIds = new Set(actionOrder.filter(matchesFilterAndQuery));
  const showEmptyClusters = !state.query.trim() && (state.filter === 'all' || state.filter === 'clustered');
  const visibleClusters = state.clusters.filter(c =>
    (c.actions.length === 0 && showEmptyClusters) || c.actions.some(id => visibleIds.has(id))
  );
  const standaloneIds = actionOrder.filter(id => !getActionCluster(id) && visibleIds.has(id));
  const showStandaloneZone = state.filter !== 'clustered' && (standaloneIds.length > 0 || !state.query.trim());

  if (visibleIds.size === 0 && visibleClusters.length === 0) {
    main.innerHTML = `<div class="empty-state">조건에 맞는 동작이 없습니다. 검색어나 필터를 초기화해 보세요.</div>`;
    return;
  }

  let html = '';
  if (visibleClusters.length > 0) {
    html += `
      <div class="section-head">
        <div class="section-title">그룹 클러스터 (${visibleClusters.length}개 · 항목 드래그로 이동 / 헤더 클릭으로 편집)</div>
      </div>
      <div class="cluster-grid">
    `;
    for (const c of visibleClusters) {
      const members = c.actions.filter(id => visibleIds.has(id));
      const isCol = state.collapsedClusters.has(c.id);
      const isSel = state.selectedType === 'cluster' && state.selectedId === c.id;
      html += `
        <section class="cluster-card ${isCol ? 'collapsed' : ''} ${isSel ? 'selected' : ''}"
                 style="--c-color:${c.color};"
                 data-drop-cluster="${c.id}">
          <div class="cluster-head" data-cluster-id="${c.id}">
            <div>
              <div class="cluster-name-ko"><span class="cluster-dot"></span>${esc(c.ko)}</div>
              <div class="cluster-name-en">${esc(c.alias)} · ${esc(c.id)}</div>
            </div>
            <div class="cluster-badges">
              <span class="count-badge">${c.actions.length}</span>
              <button class="collapse-btn" data-collapse="${c.id}" title="접기/펼치기">${isCol ? '▸' : '▾'}</button>
            </div>
          </div>
          <div class="cluster-body">
            ${members.length
              ? members.map(id => renderActionRowHTML(id, false)).join('')
              : `<div class="cluster-empty-drop">여기로 동작을 드래그해서 추가하세요</div>`
            }
          </div>
        </section>
      `;
    }
    html += `</div>`;
  }

  if (showStandaloneZone) {
    html += `
      <div class="section-head">
        <div class="section-title">단독 항목 · 미그루핑 (${standaloneIds.length}개 · 그룹에서 빼려면 여기로 드래그)</div>
      </div>
      <div class="standalone-zone" data-drop-standalone="1">
        ${standaloneIds.length
          ? `<div class="standalone-grid">${standaloneIds.map(id => renderActionRowHTML(id, true)).join('')}</div>`
          : `<div class="cluster-empty-drop">단독 항목이 없습니다. 그룹에서 해제할 동작을 여기로 드래그하세요.</div>`
        }
      </div>
    `;
  }

  main.innerHTML = html;

  // Bind click, hover, and drag-and-drop
  main.querySelectorAll('[data-action-id]').forEach(el => {
    const gid = el.getAttribute('data-action-id');
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      selectAction(gid);
    });
    el.addEventListener('mouseenter', () => applyHoverHighlights(gid));
    el.addEventListener('mouseleave', () => applyHoverHighlights(null));
    el.addEventListener('dragstart', (e) => {
      state.draggingActionId = gid;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', gid);
    });
    el.addEventListener('dragend', () => {
      state.draggingActionId = null;
      el.classList.remove('dragging');
      main.querySelectorAll('.drag-over').forEach(z => z.classList.remove('drag-over'));
    });
  });

  main.querySelectorAll('[data-drop-cluster]').forEach(card => {
    const cid = card.getAttribute('data-drop-cluster');
    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', (e) => {
      if (!card.contains(e.relatedTarget)) card.classList.remove('drag-over');
    });
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.classList.remove('drag-over');
      const gid = e.dataTransfer.getData('text/plain') || state.draggingActionId;
      if (gid && actions[gid]) moveActionToCluster(gid, cid);
    });
  });

  const stZone = main.querySelector('[data-drop-standalone]');
  if (stZone) {
    stZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      stZone.classList.add('drag-over');
    });
    stZone.addEventListener('dragleave', (e) => {
      if (!stZone.contains(e.relatedTarget)) stZone.classList.remove('drag-over');
    });
    stZone.addEventListener('drop', (e) => {
      e.preventDefault();
      stZone.classList.remove('drag-over');
      const gid = e.dataTransfer.getData('text/plain') || state.draggingActionId;
      if (gid && actions[gid]) moveActionToCluster(gid, null);
    });
  }

  main.querySelectorAll('[data-cluster-id]').forEach(el => {
    el.addEventListener('click', () => selectCluster(el.getAttribute('data-cluster-id')));
  });
  main.querySelectorAll('[data-collapse]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const cid = btn.getAttribute('data-collapse');
      if (state.collapsedClusters.has(cid)) state.collapsedClusters.delete(cid);
      else state.collapsedClusters.add(cid);
      renderBoardView(main);
    });
  });
}

function renderSequenceView(main) {
  const visibleIds = actionOrder.filter(matchesFilterAndQuery);
  if (visibleIds.length === 0) {
    main.innerHTML = `<div class="empty-state">조건에 맞는 동작이 없습니다.</div>`;
    return;
  }
  main.innerHTML = `
    <div class="section-head">
      <div class="section-title">Bayley-4th 항목 번호순 (${visibleIds.length}개 · 클릭 후 우측 패널에서 그룹 변경 가능)</div>
    </div>
    <div class="seq-list">
      ${visibleIds.map(gid => {
        const a = actions[gid];
        const c = getActionCluster(gid);
        const styleVar = `--c-color:${c ? c.color : '#94a3b8'};`;
        const isSel = state.selectedType === 'action' && state.selectedId === gid;
        const cross = getCrossLinks(gid);
        return `
          <div class="seq-card ${isSel ? 'selected' : ''}" data-action-id="${gid}" style="${styleVar}">
            <div class="action-top">
              <span class="gm-id">${gid}</span>
              <span class="action-title" title="${esc(a.name_ko)} (${esc(a.name_en)})">${esc(a.name_ko)} <span class="en">(${esc(a.name_en)})</span></span>
            </div>
            <div class="action-desc" style="padding-left:2px;">${esc(a.desc)}</div>
            <div class="seq-meta">
              <span class="mini-pill" style="${c ? `color:${c.color};border-color:${c.color}44;` : ''}">${c ? esc(c.ko) : '단독 항목'}</span>
              ${cross.length ? `<span class="cross-tag">교차 ↔ ${cross.join(', ')}</span>` : ''}
            </div>

  main.querySelectorAll('[data-action-id]').forEach(el => {

    el.addEventListener('mouseenter', () => applyHoverHighlights(gid));
    el.addEventListener('mouseleave', () => applyHoverHighlights(null));
  });
}

function renderGraphView(main) {
  const visibleIds = new Set(actionOrder.filter(matchesFilterAndQuery));
  const W = 1040;
  const colsPerRow = state.clusters.length <= 3 ? Math.max(1, state.clusters.length) : (state.clusters.length === 4 ? 4 : 4);
  const padX = 16, gapX = 14, gapY = 26;

  // Dynamic cluster box layout
  const nodePos = {};
  const svgParts = [];
  let curY = 18;
  const rows = [];
  for (let i = 0; i < state.clusters.length; i += colsPerRow) {
    rows.push(state.clusters.slice(i, i + colsPerRow));
  }

  for (const row of rows) {
    const cnt = row.length;
    const boxW = (W - padX * 2 - gapX * (cnt - 1)) / cnt;
    let maxH = 90;
    const heights = row.map(c => Math.max(84, 38 + c.actions.length * 42));
    maxH = Math.max(...heights);

    row.forEach((c, idx) => {
      const bx = padX + idx * (boxW + gapX);
      const by = curY;
      const bh = heights[idx];
      const isSelC = state.selectedType === 'cluster' && state.selectedId === c.id;
      const titleLabel = c.ko.length > 18 ? c.ko.slice(0, 17) + '…' : c.ko;
      svgParts.push(`
        <g class="g-cluster" data-g-cluster="${c.id}" style="cursor:pointer;">
          <rect x="${bx}" y="${by}" width="${boxW}" height="${bh}" rx="10"
                fill="${c.color}12" stroke="${c.color}" stroke-width="${isSelC ? 2.5 : 1.2}" stroke-opacity="${isSelC ? 1 : 0.55}" />
          <text x="${bx + 10}" y="${by + 19}" font-size="11.5" font-weight="700" fill="${c.color}">${esc(titleLabel)}</text>
          <text x="${bx + boxW - 10}" y="${by + 19}" font-size="10" font-weight="600" text-anchor="end" fill="${c.color}" opacity="0.8">${c.actions.length}개</text>
        </g>
      `);
      c.actions.forEach((gid, mIdx) => {
        const nw = boxW - 20;
        const nh = 34;
        const nx = bx + 10;
        const ny = by + 30 + mIdx * 42;
        nodePos[gid] = { x: nx, y: ny, w: nw, h: nh, cx: nx + nw / 2, cy: ny + nh / 2, color: c.color };
      });
    });
    curY += maxH + gapY;
  }

  // External ghost nodes band (Item 20, Item 33)
  const externalNodes = [];
  if (state.showExternalInGraph) {
    externalNodes.push(
      { id: 'GM_20', label: 'Item 20 (미포함)', x: 24,  y: curY - 12, w: 120, h: 24 },
      { id: 'GM_33', label: 'Item 33 (미포함)', x: 158, y: curY - 12, w: 120, h: 24 }
    );
    for (const ex of externalNodes) {
      nodePos[ex.id] = { x: ex.x, y: ex.y, w: ex.w, h: ex.h, cx: ex.x + ex.w / 2, cy: ex.y + ex.h / 2, external: true };
    }
    curY += 26;
  }

  // Standalone band
  const standalones = actionOrder.filter(id => !getActionCluster(id));
  const stCols = 3;
  const stRows = Math.max(1, Math.ceil(standalones.length / stCols));
  const stH = 38 + stRows * 46;
  svgParts.push(`
    <rect x="${padX}" y="${curY}" width="${W - padX * 2}" height="${stH}" rx="10"
          fill="var(--surface-2)" stroke="var(--border-strong)" stroke-dasharray="4 4" stroke-width="1" />
    <text x="${padX + 12}" y="${curY + 19}" font-size="11.5" font-weight="700" fill="var(--text-3)">단독 항목 · 미그루핑 (${standalones.length}개)</text>
  `);
  const stColW = (W - padX * 2 - 28 - (stCols - 1) * 12) / stCols;
  standalones.forEach((gid, idx) => {
    const col = idx % stCols;
    const row = Math.floor(idx / stCols);
    const nx = padX + 14 + col * (stColW + 12);
    const ny = curY + 30 + row * 46;
    nodePos[gid] = { x: nx, y: ny, w: stColW, h: 36, cx: nx + stColW / 2, cy: ny + 18, color: '#64748b' };
  });
  const H = curY + stH + 18;

  // Edges
  const edgeKeys = new Set();
  const edges = [];
  for (const gid of actionOrder) {
    const a = actions[gid];
    const myC = getActionCluster(gid)?.id || null;
    for (const rid of a.related) {
      if (!nodePos[gid] || !nodePos[rid]) continue;
      const isExt = !actions[rid];
      if (isExt && !state.showExternalInGraph) continue;
      const key = isExt ? `${gid}->${rid}` : [gid, rid].sort().join('--');
      if (edgeKeys.has(key)) continue;
      edgeKeys.add(key);
      const otherC = isExt ? null : (getActionCluster(rid)?.id || null);
      const isCross = !isExt && myC !== otherC;
      edges.push({ from: gid, to: rid, isCross, isExt });
    }
  }

  const edgeSvg = edges.map(e => {
    const p1 = nodePos[e.from];
    const p2 = nodePos[e.to];
    let d;
    if (e.isCross) {
      const mx = (p1.cx + p2.cx) / 2;
      const my = (p1.cy + p2.cy) / 2 - 38;
      d = `M ${p1.cx} ${p1.cy} Q ${mx} ${my} ${p2.cx} ${p2.cy}`;
    } else if (e.isExt) {
      d = `M ${p1.cx} ${p1.cy} L ${p2.cx} ${p2.cy}`;
    } else {
      const offset = 24;
      d = `M ${p1.x + p1.w} ${p1.cy} C ${p1.x + p1.w + offset} ${p1.cy}, ${p2.x + p2.w + offset} ${p2.cy}, ${p2.x + p2.w} ${p2.cy}`;
    }
    const stroke = e.isCross ? '#f59e0b' : (e.isExt ? '#94a3b8' : (p1.color || '#94a3b8'));
    const dash = e.isCross ? '6 4' : (e.isExt ? '3 3' : '');
    const sw = e.isCross ? 2.2 : 1.4;
    const op = e.isCross ? 0.9 : 0.45;
    return `<path class="g-edge" data-from="${e.from}" data-to="${e.to}" d="${d}" stroke="${stroke}" stroke-width="${sw}" ${dash ? `stroke-dasharray="${dash}"` : ''} opacity="${op}" />`;
  }).join('');

  const extSvg = externalNodes.map(ex => `
    <g class="g-node" data-g-node="${ex.id}">
      <rect x="${ex.x}" y="${ex.y}" width="${ex.w}" height="${ex.h}" rx="12"
            fill="var(--surface)" stroke="#94a3b8" stroke-dasharray="3 2" stroke-width="1.2" />
      <text x="${ex.x + ex.w / 2}" y="${ex.y + 15.5}" font-size="10.5" font-weight="600" text-anchor="middle" fill="var(--text-3)">${ex.label}</text>
    </g>
  `).join('');

  const nodeSvg = actionOrder.map(gid => {
    const a = actions[gid];
    const p = nodePos[gid];
    if (!p) return '';
    const isSel = state.selectedType === 'action' && state.selectedId === gid;
    const dim = !visibleIds.has(gid) ? 0.22 : 1;
    const maxChars = Math.max(8, Math.floor((p.w - 64) / 11));
    const labelKo = a.name_ko.length > maxChars ? a.name_ko.slice(0, maxChars - 1) + '…' : a.name_ko;
    return `
      <g class="g-node" data-g-node="${gid}" opacity="${dim}">
        <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="7"
              fill="var(--surface)" stroke="${isSel ? '#2563eb' : p.color}" stroke-width="${isSel ? 2.5 : 1.2}" />
        <rect x="${p.x + 5}" y="${p.y + 7}" width="44" height="20" rx="4" fill="${p.color}1e" />
        <text x="${p.x + 27}" y="${p.y + 20.5}" font-family="var(--mono)" font-size="10.5" font-weight="700" text-anchor="middle" fill="${p.color}">${gid}</text>
        <text x="${p.x + 56}" y="${p.y + 21}" font-size="11.5" font-weight="600" fill="var(--text)">${esc(labelKo)}</text>
      </g>
    `;
  }).join('');

  main.innerHTML = `
    <div class="graph-wrap">
      <div class="graph-toolbar">
        <div class="legend">
          <span class="legend-item"><span class="legend-line" style="background:#4f46e5;"></span>같은 그룹 내 Related</span>
          <span class="legend-item"><span class="legend-line" style="border-top:2px dashed #f59e0b;background:none;"></span><strong>다른 그룹 교차 Related</strong></span>
          <span class="legend-item"><span class="legend-line" style="border-top:2px dotted #94a3b8;background:none;"></span>config 미포함 참조 (Item 20, 33)</span>
        </div>
        <label style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;">
          <input type="checkbox" id="extGraphToggle" ${state.showExternalInGraph ? 'checked' : ''} />
          미포함 항목(20, 33) 표시
        </label>
      </div>
      <div class="graph-svg-box">
        <svg id="relGraph" viewBox="0 0 ${W} ${H}">
          ${svgParts.join('')}
          ${edgeSvg}
          ${extSvg}
          ${nodeSvg}
        </svg>
      </div>
    </div>
  `;

  document.getElementById('extGraphToggle').addEventListener('change', (e) => {
    state.showExternalInGraph = e.target.checked;
    renderGraphView(main);
  });
  main.querySelectorAll('[data-g-cluster]').forEach(el => {
    el.addEventListener('click', () => selectCluster(el.getAttribute('data-g-cluster')));
  });

  const allNodeEls = main.querySelectorAll('[data-g-node]');
  const allEdgeEls = main.querySelectorAll('.g-edge');
  allNodeEls.forEach(el => {
    const gid = el.getAttribute('data-g-node');
    if (actions[gid]) {
      el.addEventListener('click', (e) => { e.stopPropagation(); selectAction(gid); });
    }
    el.addEventListener('mouseenter', () => {
      const neighbors = new Set([gid]);
      allEdgeEls.forEach(ed => {
        const f = ed.getAttribute('data-from');
        const t = ed.getAttribute('data-to');
        if (f === gid || t === gid) {
          neighbors.add(f); neighbors.add(t);
          ed.setAttribute('opacity', '1');
          ed.setAttribute('stroke-width', '3');
        } else {
          ed.setAttribute('opacity', '0.1');
        }
      });
      allNodeEls.forEach(n => {
        n.setAttribute('opacity', neighbors.has(n.getAttribute('data-g-node')) ? '1' : '0.22');
      });
    });
    el.addEventListener('mouseleave', () => {
      allEdgeEls.forEach(ed => {
        const isDash = ed.getAttribute('stroke-dasharray') === '6 4';
        ed.setAttribute('opacity', isDash ? '0.9' : '0.45');
        ed.setAttribute('stroke-width', isDash ? '2.2' : '1.4');
      });
      allNodeEls.forEach(n => {
        const nid = n.getAttribute('data-g-node');

// Download & Import JSON
function buildExportJSONText() {
  return JSON.stringify(serializeForExport(state.clusters), null, 2);
}

function downloadActionGroupJSON() {
  const text = buildExportJSONText();
  const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'action_group.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('action_group.json 다운로드 완료!');
}

function importActionGroupJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result || ''));
      if (!parsed || typeof parsed !== 'object' || typeof parsed.clusters !== 'object') {
        throw new Error('clusters 객체가 없습니다.');
      }
      pushUndo();
      const baseMetaById = Object.fromEntries(BASE_DATA.clusters.map(c => [c.id, c]));
      const nextClusters = [];
      let i = 0;
      for (const [cid, cinfo] of Object.entries(parsed.clusters)) {
        if (!cinfo || !Array.isArray(cinfo.actions)) continue;
        const known = baseMetaById[cid];
        const validMembers = cinfo.actions
          .filter(id => Boolean(actions[id]))
          .sort((x, y) => actions[x].num - actions[y].num);
        nextClusters.push({
          id: cid,
          ko: known ? known.ko : (cinfo.alias || cinfo.title || cid),
          title: cinfo.title || cid,
          alias: cinfo.alias || cid,
          desc: cinfo.desc || '',
          actions: validMembers,
          color: known ? known.color : PALETTE[i % PALETTE.length],
          order: i + 1,
        });
        i++;
      }
      state.clusters = nextClusters;
      state.selectedType = null;
      state.selectedId = null;
      afterMutate();
      showToast(`${file.name} 불러오기 완료 (${nextClusters.length}개 그룹)`);
    } catch (err) {
      alert('JSON 불러오기 실패: ' + err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement?.tagName;
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) {
    e.preventDefault();
    undo();
    return;
  }
  if (e.key === '/' && !typing) {
    e.preventDefault();
    searchInput.focus();
  } else if (e.key === 'Escape') {
    if (jsonModal.classList.contains('open')) {
      jsonModal.classList.remove('open');
    } else if (document.activeElement === searchInput) {
      searchInput.blur();
    } else if (!typing && state.selectedId) {
      clearSelection();
    }
  }
});
