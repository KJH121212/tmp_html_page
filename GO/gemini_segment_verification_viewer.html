<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Bayley Multi-Model Segment Verification Dashboard</title>
<style>
    :root {
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --border: #e2e8f0;
        --score-2: #16a34a;
        --score-1: #ea580c;
        --score-0: #dc2626;
        --gemini-color: #6366f1;
        --cload-color: #0284c7;
        --astra-color: #d97706;
    }
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "맑은 고딕", sans-serif;
        margin: 0; padding: 24px; background: var(--bg-color); color: #1e293b;
    }
    .container { max-width: 1600px; margin: 0 auto; }

    /* 상단 컨트롤 패널 */
    .control-panel {
        position: sticky; top: 12px; background: var(--card-bg); padding: 18px 24px;
        border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); border: 1px solid var(--border);
        z-index: 100; margin-bottom: 20px;
    }
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .video-selector {
        padding: 8px 12px; font-size: 15px; font-weight: 700; border-radius: 8px;
        border: 1px solid #cbd5e1; outline: none; cursor: pointer; background: #fff;
    }
    .current-status { font-family: monospace; font-size: 14px; font-weight: 700; color: #2563eb; }

    /* 타임라인 바 스타일 */
    .timeline-group { margin-bottom: 8px; }
    .timeline-legend { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin: 2px 0 2px 2px; color: #475569; }
    .timeline-container {
        position: relative; height: 26px; background: #e2e8f0; border-radius: 6px;
        overflow: hidden; cursor: pointer;
    }
    .action-block {
        position: absolute; height: 100%; top: 0; opacity: 0.9;
        display: flex; align-items: center; justify-content: center;
        color: white; font-size: 11px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px;
    }
    .block-gemini { background-color: var(--gemini-color); border: 1px solid #4338ca; }
    .block-cload { background-color: var(--cload-color); border: 1px solid #0369a1; }
    .block-astra { background-color: var(--astra-color); border: 1px solid #b45309; }

    .scrubber-line {
        position: absolute; top: 0; bottom: 0; width: 3px; background: #0f172a;
        z-index: 10; pointer-events: none; transition: left 0.05s ease-out;
    }

    /* 슬라이더 바 */
    .slider-box { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .slider {
        flex: 1; height: 8px; border-radius: 4px; outline: none;
        -webkit-appearance: none; background: #cbd5e1; cursor: pointer;
    }
    .slider::-webkit-slider-thumb {
        -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
        background: #2563eb; cursor: pointer; border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }

    /* 실시간 포커스 카드 */
    .active-card {
        background: #eff6ff; border-left: 6px solid #2563eb; border-radius: 10px;
        padding: 16px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-start;
        border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    .active-text-wrapper { display: flex; align-items: center; gap: 10px; }
    .active-text { font-size: 15px; font-weight: 700; color: #1e3a8a; }
    .active-badges-grid { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; min-width: 320px; }

    /* 테이블 */
    .table-card {
        background: var(--card-bg); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        border: 1px solid var(--border); overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; min-width: 1200px; }
    th, td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { background: #f1f5f9; color: #475569; font-weight: 700; font-size: 12px; text-align: left; }
    
    tr.acting-row { background-color: #fcfcfd; }
    tr.current-highlight {
        background-color: #fef08a !important; outline: 2px solid #eab308; font-weight: bold;
    }
    
    /* 뱃지 */
    .badge {
        display: inline-block; padding: 3px 6px; border-radius: 4px;
        font-size: 11px; font-weight: 700; color: #fff; margin: 1px 2px;
    }
    .badge-2 { background: var(--score-2); }
    .badge-1 { background: var(--score-1); }
    .badge-0 { background: var(--score-0); }
    .badge-gemini { background: var(--gemini-color); }
    .badge-cload { background: var(--cload-color); }
    .badge-astra { background: var(--astra-color); }
    
    .speaker-badge {
        display: inline-block; padding: 3px 8px; border-radius: 12px;
        font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .spk-person-1 { background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; }
    .spk-person-2 { background: #ccfbf1; color: #115e59; border: 1px solid #99f6e4; }
    .spk-person-3 { background: #fce7f3; color: #9d174d; border: 1px solid #fbcfe8; }
    .spk-unknown  { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

    .time-cell { font-family: monospace; font-size: 12px; color: #64748b; white-space: nowrap; }
</style>
</head>
<body>

<div class="container">
    <div class="control-panel">
        <div class="top-row">
            <div>
                <label style="font-weight: 700; margin-right: 8px;">비디오 선택:</label>
                <select id="videoSelect" class="video-selector" onchange="changeVideo(this.value)"></select>
            </div>
            <div class="current-status" id="timeStatus">00:00.0 / 00:00.0 (0.0%)</div>

        <!-- 1) 정답 Ground Truth 타임라인 -->
        <div class="timeline-group">
            <div class="timeline-legend">
                <span>정답 동작 (Ground Truth)</span>
                <span>초록: 2점 / 주황: 1점 / 빨강: 0점</span>
            </div>
            <div class="timeline-container" id="gtTimelineBar" onclick="jumpToTimeline(event)">
                <div class="scrubber-line" id="gtScrubber" style="left: 0%;"></div>
            </div>
        </div>

        <!-- 2) Gemini 예측 세그먼트 -->
        <div class="timeline-group">
            <div class="timeline-legend">
                <span style="color: var(--gemini-color);">Gemini 예측 세그먼트</span>
            </div>
            <div class="timeline-container" id="geminiTimelineBar" onclick="jumpToTimeline(event)">
                <div class="scrubber-line" id="geminiScrubber" style="left: 0%;"></div>
            </div>
        </div>

        <!-- 3) Cload 예측 세그먼트 -->
        <div class="timeline-group">
            <div class="timeline-legend">
                <span style="color: var(--cload-color);">Cload 예측 세그먼트</span>
            </div>
            <div class="timeline-container" id="cloadTimelineBar" onclick="jumpToTimeline(event)">
                <div class="scrubber-line" id="cloadScrubber" style="left: 0%;"></div>
            </div>
        </div>

        <!-- 4) Astra 예측 세그먼트 -->
        <div class="timeline-group">
            <div class="timeline-legend">
                <span style="color: var(--astra-color);">Astra 예측 세그먼트</span>
            </div>
            <div class="timeline-container" id="astraTimelineBar" onclick="jumpToTimeline(event)">
                <div class="scrubber-line" id="astraScrubber" style="left: 0%;"></div>
            </div>
        </div>

        <!-- 시간 슬라이더 -->
        <div class="slider-box">
            <span style="font-size: 12px; color: #64748b;">0s</span>
            <input type="range" min="0" max="100" value="0" step="0.1" class="slider" id="timeSlider" oninput="onSliderMove(this.value)">
            <span style="font-size: 12px; color: #64748b;" id="totalDurationLabel">0s</span>
        </div>
    </div>

    <!-- 실시간 포커스 카드 -->
    <div class="active-card">
        <div style="flex: 1; padding-right: 20px;">
            <div style="font-size: 12px; color: #64748b; margin-bottom: 4px;">선택 시점 발화 대사:</div>
            <div class="active-text-wrapper">
                <span id="activeSpeaker"></span>
                <span class="active-text" id="activeText">슬라이더를 조작하여 각 모델의 예측 구간을 비교하세요.</span>
            </div>
            <div id="activeDescriptions" style="margin-top: 8px; font-size: 13px; color: #334155; line-height: 1.4;"></div>
        </div>
        <div class="active-badges-grid">
            <div id="activeGtBadges"></div>
            <div id="activeGeminiBadges"></div>
            <div id="activeCloadBadges"></div>
            <div id="activeAstraBadges"></div>
        </div>
    </div>

    <!-- 전체 비교 테이블 -->
    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th style="width: 110px;">시간 구간</th>
                    <th style="width: 80px;">화자</th>
                    <th style="min-width: 250px;">STT 발화 대사</th>
                    <th style="width: 180px;">실제 정답 (GT)</th>
                    <th style="width: 200px;">Gemini 예측</th>
                    <th style="width: 200px;">Cload 예측</th>
                    <th style="width: 200px;">Astra 예측</th>
                </tr>
            </thead>
            <tbody id="dialogueBody"></tbody>
        </table>
    </div>
</div>

let currentVideoKey = "";
let currentDuration = 180;

function formatSec(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    const ms = Math.floor((sec % 1) * 10);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${ms}`;
}

function getSpeakerBadgeClass(speaker) {
    const s = (speaker || '').toLowerCase().replace(/\s+/g, '-');
    if (s.includes('person-1')) return 'spk-person-1';
    if (s.includes('person-2')) return 'spk-person-2';
    if (s.includes('person-3')) return 'spk-person-3';
    return 'spk-unknown';
}

// 1. 셀렉터 초기화
const selector = document.getElementById('videoSelect');
Object.keys(data).forEach((key) => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.innerText = key;
    selector.appendChild(opt);
});

// 2. 공통 타임라인 바 렌더링
function renderTimelineBar(containerId, scrubberId, items, colorClass, isGt = false) {
    const container = document.getElementById(containerId);
    container.innerHTML = `<div class="scrubber-line" id="${scrubberId}" style="left: 0%;"></div>`;

    items.forEach(item => {
        const left = (item.start / currentDuration) * 100;
        const width = Math.max(((item.end - item.start) / currentDuration) * 100, 0.6);
        
        const block = document.createElement('div');
        block.className = `action-block ${colorClass}`;
        block.style.left = `${left}%`;
        block.style.width = `${width}%`;

        if (isGt) {
            block.style.backgroundColor = item.score === 2 ? 'var(--score-2)' : item.score === 1 ? 'var(--score-1)' : 'var(--score-0)';
            block.innerText = item.label.split(' ')[0];
            block.title = `[GT] ${item.label} (${item.start}s ~ ${item.end}s)`;
        } else {
            block.innerText = item.action;
            const tooltipDesc = item.description ? `\n설명: ${item.description}` : '';
            block.title = `[${colorClass.replace('block-', '').toUpperCase()}] ${item.action} (${item.start}s ~ ${item.end}s)${tooltipDesc}`;
        }
        container.appendChild(block);
    });
}

        tbody.appendChild(tr);
    });

    updateState(0);
}

// 4. 슬라이더/인터랙션 핸들러
function onSliderMove(sec) {
    updateState(parseFloat(sec));
}

function jumpToTimeline(event) {
    const rect = event.currentTarget.getBoundingClientRect();
    const clickX = event.clientX - rect.left;
    const pct = clickX / rect.width;
    const targetSec = currentDuration * pct;
    document.getElementById('timeSlider').value = targetSec;
    updateState(targetSec);
}

function updateState(sec) {
    const pct = ((sec / currentDuration) * 100).toFixed(1);
    document.getElementById('timeStatus').innerText = `${formatSec(sec)} / ${formatSec(currentDuration)} (${pct}%)`;
    
    // 4개 타임라인 스크러버 동기화
    ['gtScrubber', 'geminiScrubber', 'cloadScrubber', 'astraScrubber'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.left = `${pct}%`;
    });

    const vData = data[currentVideoKey];
    let activeItem = null;
    let activeIdx = -1;

    vData.dialogues.forEach((d, idx) => {
        const row = document.getElementById(`row-${idx}`);
        row.classList.remove('current-highlight');

        if (d.start <= sec && sec <= d.end) {
            activeItem = d;
            activeIdx = idx;
        }
    });

    const activeText = document.getElementById('activeText');
    const activeSpeaker = document.getElementById('activeSpeaker');
    const activeGtBadges = document.getElementById('activeGtBadges');
    const activeGeminiBadges = document.getElementById('activeGeminiBadges');
    const activeCloadBadges = document.getElementById('activeCloadBadges');
    const activeAstraBadges = document.getElementById('activeAstraBadges');
    const activeDescriptions = document.getElementById('activeDescriptions');

    // 현재 시점 각 모델의 description 수집
    function getActiveModelDescs(modelName, segList, colorClass) {
        return segList
            .filter(item => item.start <= sec && sec <= item.end && item.description)
            .map(item => `<div><strong style="color:var(--${colorClass}-color)">[${modelName}]</strong> ${item.description}</div>`);
    }

    const descs = [
        ...getActiveModelDescs('Gemini', vData.gemini_segments, 'gemini'),
        ...getActiveModelDescs('Cload', vData.cload_segments, 'cload'),
        ...getActiveModelDescs('Astra', vData.astra_segments, 'astra')
    ];
    activeDescriptions.innerHTML = descs.join('');

    if (activeItem) {
        const spkClass = getSpeakerBadgeClass(activeItem.speaker);
        activeSpeaker.innerHTML = `<span class="speaker-badge ${spkClass}" style="font-size:12px;">${activeItem.speaker}</span>`;
        activeText.innerText = `"${activeItem.text}"`;
        
        activeGtBadges.innerHTML = activeItem.matched_gt.length > 0
            ? '<span style="font-size:11px;color:#64748b;margin-right:6px;">GT:</span>' + activeItem.matched_gt.map(act => `<span class="badge badge-${activeItem.score_gt ?? 2}">${act}</span>`).join(' ')
            : '';

        activeGeminiBadges.innerHTML = activeItem.matched_gemini.length > 0
            ? '<span style="font-size:11px;color:var(--gemini-color);margin-right:6px;">Gemini:</span>' + activeItem.matched_gemini.map(act => `<span class="badge badge-gemini">${act}</span>`).join(' ')
            : '';

        activeCloadBadges.innerHTML = activeItem.matched_cload.length > 0
            ? '<span style="font-size:11px;color:var(--cload-color);margin-right:6px;">Cload:</span>' + activeItem.matched_cload.map(act => `<span class="badge badge-cload">${act}</span>`).join(' ')
            : '';

        activeAstraBadges.innerHTML = activeItem.matched_astra.length > 0
            ? '<span style="font-size:11px;color:var(--astra-color);margin-right:6px;">Astra:</span>' + activeItem.matched_astra.map(act => `<span class="badge badge-astra">${act}</span>`).join(' ')
            : '';

        const targetRow = document.getElementById(`row-${activeIdx}`);
        targetRow.classList.add('current-highlight');
        targetRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else {
        activeSpeaker.innerHTML = "";
        activeText.innerText = "(발화 대사 없음)";
        activeGtBadges.innerHTML = "";
        activeGeminiBadges.innerHTML = "";
        activeCloadBadges.innerHTML = "";
        activeAstraBadges.innerHTML = "";
    }
}

// 초기 실행
if (Object.keys(data).length > 0) {
    changeVideo(Object.keys(data)[0]);
}
</script>
